<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente Financeiro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --text: #17202a;
    --muted: #5d6b79;
    --border: #dde3ea;
    --accent: #0f766e;
    --accent-text: #ffffff;
    --user-bubble: #0f766e;
    --user-text: #ffffff;
    --danger: #b42318;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1418;
      --surface: #161e24;
      --surface-2: #1e2830;
      --text: #e6edf2;
      --muted: #93a3b1;
      --border: #2a3640;
      --accent: #2dd4bf;
      --accent-text: #052e2b;
      --user-bubble: #134e4a;
      --user-text: #e6fffb;
      --danger: #f97066;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif;
  }
  button, input { font: inherit; }
  .hidden { display: none !important; }

  /* Login */
  .login-wrap { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .card {
    width: 100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 28px; box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font-weight: 600;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 22px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; margin: 14px 0 6px; }
  input[type=text], input[type=date] {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent); }
  .primary {
    width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 10px;
    background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; margin-top: 12px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* Chat */
  .app { height: 100%; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  header .who { font-size: 13px; color: var(--muted); }
  .ghost {
    background: none; border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.bot p { margin: 0 0 8px; } .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0 8px; padding-left: 20px; }
  .table-wrap { overflow-x: auto; margin: 6px 0; }
  .msg.bot table { border-collapse: collapse; font-size: 14px; }
  .msg.bot th, .msg.bot td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; white-space: nowrap; }
  .msg.bot th { color: var(--muted); font-weight: 500; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tool { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; }
  .typing { color: var(--muted); font-style: italic; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 10px; }
  .chip {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  .chip:hover, .ghost:hover { border-color: var(--accent); }
  form.composer { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); }
  form.composer input {
    flex: 1; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); outline: none; min-width: 0;
  }
  form.composer button {
    border: 0; border-radius: 12px; padding: 0 18px; background: var(--accent); color: var(--accent-text);
    font-weight: 600; cursor: pointer;
  }
  form.composer button:disabled { opacity: .6; cursor: default; }
  @media (max-width: 560px) { .msg { max-width: 92%; } header .who { display: none; } }
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <form class="card" id="login-form">
    <div class="brand"><div class="logo">$</div><h1>Assistente Financeiro</h1></div>
    <p class="sub">Pergunte sobre seus gastos, transações e contas.</p>
    <label for="doc">Número do documento</label>
    <input id="doc" type="text" autocomplete="off" required>
    <label for="dob">Data de nascimento</label>
    <input id="dob" type="date" required>
    <button class="primary" id="login-btn" type="submit">Entrar</button>
    <button class="link" type="button" id="demo-btn">Usar cliente de demonstração</button>
    <div class="error" id="login-error"></div>
  </form>
</div>

<div id="chat" class="app hidden">
  <header>
    <div class="brand"><div class="logo">$</div><h1 id="greeting">Olá</h1></div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="who" id="model"></span>
      <button class="ghost" id="logout-btn">Sair</button>
    </div>
  </header>
  <div class="messages" id="messages"></div>
  <div class="suggestions" id="suggestions"></div>
  <form class="composer" id="composer">
    <input id="input" type="text" placeholder="Escreva sua pergunta..." autocomplete="off">
    <button id="send-btn" type="submit">Enviar</button>
  </form>
</div>

<script>
const TOOL_LABELS = {
  spending_summary: "Resumo de gastos",
  list_transactions: "Transações",
  declined_transactions: "Transações negadas",
  get_my_accounts: "Contas e cartões",
};
const SUGGESTIONS = [
  "Quanto gastei nos últimos 30 dias?",
  "Qual foi meu maior gasto em junho?",
  "Por que minha última transação foi negada?",
  "Qual o saldo das minhas contas?",
  "Mostre meus gastos por mês em 2026",
];

let sessionId = null;
const $ = (id) => document.getElementById(id);

function renderMarkdown(text) {
  const html = DOMPurify.sanitize(marked.parse(text || ""));
  const box = document.createElement("div");
  box.innerHTML = html;
  box.querySelectorAll("table").forEach((table) => {
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    table.replaceWith(wrap);
    wrap.appendChild(table);
  });
  return box;
}

function addMessage(role, text, tools) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  if (role === "bot") {
    el.appendChild(renderMarkdown(text));
    if (tools && tools.length) {
      const row = document.createElement("div");
      row.className = "tools";
      [...new Set(tools)].forEach((name) => {
        const chip = document.createElement("span");
        chip.className = "tool";
        chip.textContent = `consultou: ${TOOL_LABELS[name] || name}`;
        row.appendChild(chip);
      });
      el.appendChild(row);
    }
  } else {
    el.textContent = text;
  }
  $("messages").appendChild(el);
  $("messages").scrollTop = $("messages").scrollHeight;
  return el;
}

async function postJSON(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Session-Id": sessionId || "" },
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(data.detail || "Algo deu errado. Tente novamente.");
    error.status = response.status;
    throw error;
  }
  return data;
}

$("demo-btn").addEventListener("click", () => {
  $("doc").value = "78481769";
  $("dob").value = "1982-02-05";
});

$("login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("login-error").textContent = "";
  $("login-btn").disabled = true;
  try {
    const data = await postJSON("/api/login", {
      document_number: $("doc").value,
      date_of_birth: $("dob").value,
    });
    sessionId = data.session_id;
    $("greeting").textContent = `Olá, ${data.first_name.split(" ")[0]}`;
    $("model").textContent = data.model;
    $("login").classList.add("hidden");
    $("chat").classList.remove("hidden");
    addMessage("bot", `Olá, **${data.first_name}**! Posso ajudar com seus gastos, transações negadas e saldos. O que você quer saber?`);
    renderSuggestions();
    $("input").focus();
  } catch (error) {
    $("login-error").textContent = error.message;
  } finally {
    $("login-btn").disabled = false;
  }
});

function renderSuggestions() {
  const box = $("suggestions");
  box.innerHTML = "";
  SUGGESTIONS.forEach((text) => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = text;
    chip.addEventListener("click", () => send(text));
    box.appendChild(chip);
  });
}

async function send(text) {
  text = text.trim();
  if (!text || $("send-btn").disabled) return;
  $("suggestions").innerHTML = "";
  addMessage("user", text);
  $("input").value = "";
  $("send-btn").disabled = true;
  const typing = addMessage("bot", "");
  typing.classList.add("typing");
  typing.textContent = "Consultando seus dados...";
  try {
    const data = await postJSON("/api/chat", { message: text });
    typing.remove();
    addMessage("bot", data.answer, data.tools);
  } catch (error) {
    typing.remove();
    addMessage("bot", error.message);
    if (error.status === 401) setTimeout(logout, 1500);
  } finally {
    $("send-btn").disabled = false;
    $("input").focus();
  }
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  send($("input").value);
});

async function logout() {
  try { await postJSON("/api/logout", {}); } catch (_) {}
  sessionId = null;
  $("messages").innerHTML = "";
  $("chat").classList.add("hidden");
  $("login").classList.remove("hidden");
}
$("logout-btn").addEventListener("click", logout);
</script>
</body>
</html>
